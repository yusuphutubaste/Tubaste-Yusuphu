<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Player | Tubaste Yusuphu</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0b0f17] text-slate-100 flex items-center justify-center min-h-screen p-4 sm:p-6 font-sans antialiased">

  <!-- ================= AUDIO PLAYER COMPONENT ================= -->
  <div class="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl relative overflow-hidden">
    
    <!-- Decorative Ambient Glow -->
    <div class="absolute -top-10 -right-10 w-36 h-36 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Hidden Native HTML5 Audio Element -->
    <!-- Replace the src with your actual audio file (e.g. 'podcast-ep1.mp3') -->
    <audio id="mainAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <!-- Header / Track Details -->
    <div class="flex items-center gap-4 mb-6">
      <div class="w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700/80 overflow-hidden flex-shrink-0 flex items-center justify-center relative">
        <img id="trackCover" src="profile.jpg" alt="Episode Cover" 
             class="w-full h-full object-cover"
             onerror="this.src='https://ui-avatars.com/api/?name=Tubaste+Audio&background=f59e0b&color=0b0f17&bold=true';">
      </div>
      <div class="min-w-0 flex-1">
        <span class="text-[11px] font-bold uppercase tracking-wider text-amber-400 block mb-1">Audio Reflection</span>
        <h3 id="trackTitle" class="text-lg font-bold text-white truncate">Change Starts Right Now (Audio)</h3>
        <p id="trackArtist" class="text-xs text-slate-400">Tubaste Yusuphu</p>
      </div>
    </div>

    <!-- Progress Scrubber -->
    <div class="space-y-1.5 mb-6">
      <div class="relative w-full h-2 bg-slate-800 rounded-full cursor-pointer overflow-hidden" id="progressBarContainer">
        <div id="progressBar" class="h-full bg-gradient-to-r from-amber-500 to-amber-400 rounded-full w-0 transition-all duration-100"></div>
      </div>
      <div class="flex justify-between text-[11px] text-slate-500 font-mono">
        <span id="currentTime">0:00</span>
        <span id="totalDuration">0:00</span>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="flex items-center justify-between mb-8 px-2">
      <!-- Shuffle / Loop Dummy Toggle -->
      <button class="text-slate-400 hover:text-white transition text-sm" title="Loop track" id="loopBtn" onclick="toggleLoop()">
        <i class="fas fa-repeat"></i>
      </button>

      <div class="flex items-center gap-4">
        <!-- Prev Track -->
        <button onclick="prevTrack()" class="text-slate-400 hover:text-white transition text-lg p-2" title="Previous">
          <i class="fas fa-backward-step"></i>
        </button>

        <!-- Main Play/Pause Button -->
        <button id="playPauseBtn" onclick="togglePlay()" 
                class="w-14 h-14 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center text-xl transition shadow-lg shadow-amber-500/25 active:scale-95">
          <i class="fas fa-play ml-1" id="playIcon"></i>
        </button>

        <!-- Next Track -->
        <button onclick="nextTrack()" class="text-slate-400 hover:text-white transition text-lg p-2" title="Next">
          <i class="fas fa-forward-step"></i>
        </button>
      </div>

      <!-- Mute/Volume Toggle -->
      <button class="text-slate-400 hover:text-white transition text-sm" title="Mute" id="volumeBtn" onclick="toggleMute()">
        <i class="fas fa-volume-high" id="volumeIcon"></i>
      </button>
    </div>

    <!-- Playlist Section -->
    <div class="border-t border-slate-800/80 pt-5">
      <h4 class="text-xs uppercase tracking-wider font-bold text-slate-400 mb-3">Reflections Playlist</h4>
      <div class="space-y-2 max-h-48 overflow-y-auto pr-1" id="playlistContainer">
        <!-- Tracks dynamically rendered or clickable -->
        <button onclick="loadTrack(0)" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-left transition group">
          <span class="text-xs font-semibold text-white group-hover:text-amber-400 transition truncate">1. Change Starts Right Now</span>
          <span class="text-[11px] text-slate-400 ml-2">Audio Message</span>
        </button>

        <button onclick="loadTrack(1)" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-slate-800/30 hover:bg-slate-800 border border-slate-800 text-left transition group">
          <span class="text-xs font-semibold text-white group-hover:text-amber-400 transition truncate">2. The Secret Behind College & Life Decisions</span>
          <span class="text-[11px] text-slate-400 ml-2">Audio Message</span>
        </button>

        <button onclick="loadTrack(2)" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-slate-800/30 hover:bg-slate-800 border border-slate-800 text-left transition group">
          <span class="text-xs font-semibold text-white group-hover:text-amber-400 transition truncate">3. Wants vs. Needs in Everyday Life</span>
          <span class="text-[11px] text-slate-400 ml-2">Reflection</span>
        </button>
      </div>
    </div>

  </div>

  <!-- ================= PLAYER SCRIPT ================= -->
  <script>
    const audio = document.getElementById('mainAudio');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressBarContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const volumeIcon = document.getElementById('volumeIcon');

    // Playlist Data
    const tracks = [
      {
        title: "Change Starts Right Now",
        artist: "Tubaste Yusuphu",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        title: "The Secret Behind College & Life Decisions",
        artist: "Tubaste Yusuphu",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
      },
      {
        title: "Wants vs. Needs in Everyday Life",
        artist: "Tubaste Yusuphu",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
      }
    ];

    let currentTrackIndex = 0;

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fas fa-pause';
      } else {
        audio.pause();
        playIcon.className = 'fas fa-play ml-1';
      }
    }

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracks[currentTrackIndex];
      document.getElementById('trackTitle').textContent = track.title;
      document.getElementById('trackArtist').textContent = track.artist;
      audio.src = track.src;
      audio.play();
      playIcon.className = 'fas fa-pause';
    }

    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(currentTrackIndex);
    }

    function prevTrack() {
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentTrackIndex);
    }

    // Time update and progress bar
    audio.addEventListener('timeupdate', () => {
      const { currentTime, duration } = audio;
      if (duration) {
        const percent = (currentTime / duration) * 100;
        progressBar.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(currentTime);
        totalDurationEl.textContent = formatTime(duration);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    // Click on progress bar to scrub
    progressContainer.addEventListener('click', (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      if (duration) {
        audio.currentTime = (clickX / width) * duration;
      }
    });

    // Auto next when finished
    audio.addEventListener('ended', () => {
      nextTrack();
    });

    // Mute toggle
    function toggleMute() {
      audio.muted = !audio.muted;
      if (audio.muted) {
        volumeIcon.className = 'fas fa-volume-xmark text-amber-500';
      } else {
        volumeIcon.className = 'fas fa-volume-high';
      }
    }

    // Loop toggle
    function toggleLoop() {
      audio.loop = !audio.loop;
      const loopBtn = document.getElementById('loopBtn');
      if (audio.loop) {
        loopBtn.classList.add('text-amber-400');
        loopBtn.classList.remove('text-slate-400');
      } else {
        loopBtn.classList.remove('text-amber-400');
        loopBtn.classList.add('text-slate-400');
      }
    }
  </script>

</body>
</html>
