<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>My Live Website</title> 
    <style> 
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e3c72, #2a5298); 
            color: white; 
            text-align: center; 
            padding: 100px 20px; 
            margin: 0; 
        } 
        .container { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 15px; 
            display: inline-block; 
            backdrop-filter: blur(10px); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); 
        } 
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
        } 
        p { 
            font-size: 1.2rem; 
            color: #e0e0e0; 
        } 
        
        /* --- MENU STYLES ADDED HERE --- */
        .menu-btn {
            display: inline-block;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .bar {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 5px 0;
            transition: 0.4s;
            border-radius: 2px;
        }
        .nav-links {
            display: none; 
            flex-direction: column;
            margin-bottom: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .nav-links a:hover {
            color: #00d2ff;
        }
        .nav-links.active {
            display: flex;
        }
    </style> 
</head> 
<body>

    <div class="container">
        <!-- Hamburger Menu Button placed cleanly above your title -->
        <div class="menu-btn" onclick="toggleMenu()">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Hidden Navigation Links -->
        <div class="nav-links" id="navLinks">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </div>

        <h1>Hello World! 🚀</h1>
        <p>I coded this website directly inside GitHub!</p>
    </div>

    <!-- JavaScript function to open and close the menu links -->
    <script>
        function toggleMenu() {
            var menu = document.getElementById("navLinks");
            menu.classList.toggle("active");
        }
    </script>
</body>
</html>
