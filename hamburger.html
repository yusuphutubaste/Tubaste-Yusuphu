<!-- CSS Animation Styling for the Hamburger Icon Transforming into 'X' -->
<style>
  #hamburgerBtn.is-active .line-1 {
    transform: translateY(6px) rotate(45deg);
  }
  #hamburgerBtn.is-active .line-2 {
    opacity: 0;
    transform: scaleX(0);
  }
  #hamburgerBtn.is-active .line-3 {
    transform: translateY(-6px) rotate(-45deg);
  }
</style>

<!-- Hamburger & Drawer Interaction Script -->
<script>
  (function() {
    const btn = document.getElementById('hamburgerBtn');
    const drawer = document.getElementById('mobileDrawer');
    const backdrop = document.getElementById('mobileDrawerBackdrop');
    const drawerLinks = document.querySelectorAll('.drawer-link');

    if (!btn || !drawer || !backdrop) return;

    function openMenu() {
      btn.classList.add('is-active');
      btn.setAttribute('aria-expanded', 'true');
      drawer.classList.remove('translate-x-full');
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      document.body.style.overflow = 'hidden'; // Lock background scroll
    }

    function closeMenu() {
      btn.classList.remove('is-active');
      btn.setAttribute('aria-expanded', 'false');
      drawer.classList.add('translate-x-full');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
      document.body.style.overflow = ''; // Restore background scroll
    }

    function toggleMenu() {
      const isOpen = btn.classList.contains('is-active');
      isOpen ? closeMenu() : openMenu();
    }

    // Event listeners
    btn.addEventListener('click', toggleMenu);
    backdrop.addEventListener('click', closeMenu);

    // Close when clicking any menu link
    drawerLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && btn.classList.contains('is-active')) {
        closeMenu();
      }
    });
  })();
</script>
<!-- ================= END MOBILE HAMBURGER COMPONENT ================= -->
