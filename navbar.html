<script>
  // Mobile menu toggle handler
  (function() {
    const btn = document.getElementById('globalMobileMenuBtn');
    const menu = document.getElementById('globalMobileMenu');
    if (btn && menu) {
      btn.addEventListener('click', () => {
        menu.classList.toggle('hidden');
      });
    }

    // Automatically highlight the active link based on current filename
    const currentPath = window.location.pathname.split("/").pop() || "index.html";
    const linkMap = {
      "index.html": "nav-home",
      "about.html": "nav-about",
      "work.html": "nav-work",
      "videos.html": "nav-videos",
      "community.html": "nav-community"
    };

    const activeId = linkMap[currentPath];
    if (activeId) {
      const activeEl = document.getElementById(activeId);
      if (activeEl) {
        activeEl.classList.remove("text-slate-300");
        activeEl.classList.add("text-amber-400", "font-bold");
      }
    }
  })();
</script>
